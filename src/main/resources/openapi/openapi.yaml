openapi: 3.0.3

# The contract of the REST API, and the one file that describes all of it.
#
# This file is the source of truth: the build generates the Spring `*Api` interfaces from it (interfaces only), the
# controllers implement them, and OpenApiContractTest fails when the running application stops matching what is
# written here. Edit this file FIRST when an endpoint is added or changed. See docs/openapi.md for how and why.
#
# Conventions used below
#   security: []                        public, no token needed
#   security: [{bearerAuth: []}]        a valid token is needed
#   x-required-role: ADMIN | USER       the role the token must carry (absent = any authenticated caller). OpenAPI cannot
#                                       express roles on a bearer scheme, so this extension does, and
#                                       OpenApiSecurityConformanceTest checks it against SecurityFilterConfig.
#   x-internal: true                    the generator skips the operation: its signature is written by hand because it
#                                       returns a generic Page<T> the generator cannot express (see docs/openapi.md).
#   Schemas are NOT generated. Each one is mapped onto the hand-written record of the same name in `models`
#   (pom.xml, schemaMappings), so a schema referenced by an operation but not mapped fails the build.

info:
  title: Recettes API
  version: 0.0.1
  description: |
    The recipe library: recipes, the reference data they are written with (categories, tags, units, ingredients), the
    pictures they carry, and the accounts that write them.

    ## Authentication

    `POST /auth/login` answers with a JWT as the **raw response body**. Send it as `Authorization: Bearer <token>`.
    Tokens last one hour and do not survive an application restart. Every read in this API is public, except the
    recipe lists (`/lists`, and `GET /recipes?listId=`): they are private to their owner and need a token.

    A request that carries a *broken* token (expired, malformed, or minted before the last restart) is rejected with 401
    even on a public route, so a client should drop a token that stops working. The credential endpoints are the one
    exception: `POST /auth/login`, `POST /auth/reinit-password`, `POST /users/create` and `PUT /users/reinit-password`
    ignore a broken token, so a client still holding a stale one can log in again. A request with no token at all is
    judged by the route alone.

    ## Errors

    Every error is an RFC 9457 `application/problem+json` body (`ProblemDetail`). The status is the specific one that
    matches what happened: 400 invalid input (including an id inside a body that names nothing), 401 missing or invalid
    credentials, 403 authenticated but not allowed, 404 the resource in the path does not exist, 409 the request
    conflicts with existing state, 413 upload too large, 429 this caller made too many requests, 503 the server is
    momentarily at capacity. 429 and 503 carry `Retry-After`. The three 409s of the recipe lists (name already used, too
    many lists, list full) are told apart by the problem's `type`, never by its `detail`. An unexpected failure is a 500. Two more are raised by the
    framework before any operation runs, and are not listed on each one either: 415 for a request body that is not in a
    media type the operation reads, and 406 when nothing the operation can write matches the `Accept` header.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: Logging in, and asking for a password reset.
  - name: Users
    description: Accounts.
  - name: Recipes
    description: Recipes. Reads are public; writing needs a login; editing or deleting needs to be the author or an admin.
  - name: Recipe lists
    description: >-
      A member's private lists of recipes, each with a name and an emoji. Every route needs a login, and a list is only
      ever visible to its owner: someone else's list is a 404, exactly like one that does not exist. The content of a
      list is read through `GET /recipes?listId=`.
  - name: Categories
    description: The taxonomy that drives navigation, and the hierarchy it forms. Reads are public, writes are admin-only.
  - name: Tags
    description: Open-ended facets. Reads are public, writes are admin-only.
  - name: Units
    description: Units of measure. Reads are public, writes are admin-only.
  - name: Ingredients
    description: >-
      Ingredients. Reads are public and creating one is open to any user, because a recipe cannot be written without the
      ingredients it uses; renaming and deleting are admin-only.
  - name: Media
    description: Uploaded pictures. Upload first, then reference the returned id when creating or updating a recipe.

paths:
  # ------------------------------------------------------------------------------------------------ authentication
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: >-
        Exchanges a username and password for a JWT, returned as the raw response body (`text/plain`, no JSON
        wrapper). Unknown username, wrong password, a disabled account and a body with blank or missing fields all
        answer the same 401. Sent with `Accept: application/json` alone, the same token body is labelled
        `application/json`: it is still the bare token, not JSON.
      security: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: The signed token.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: No body, or a body that is not JSON. A JSON body with blank or missing fields is a 401.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/reinit-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Ask for a password-reset email
      description: >-
        Starts the "forgot password" flow. If the address belongs to an account, an email with a one-time reset token
        is sent. **The answer is the same whether or not the address is registered**, so this endpoint cannot be used to
        discover which addresses have accounts. The flow is completed by `PUT /users/reinit-password`.
      security: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinitPasswordRequest'
      responses:
        '202':
          description: Accepted, whether or not an email was sent.
        '400':
          $ref: '#/components/responses/BadRequest'

  # ------------------------------------------------------------------------------------------------------- users
  /users/create:
    post:
      tags: [Users]
      operationId: createUser
      summary: Register an account
      security: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: The stored account.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The username or the email is already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/update:
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update the calling account
      description: >-
        Updates **the calling account**: there is no id in the path and the body cannot name one. Every field is
        optional and an absent one is left alone. Changing `password` or `email` also needs `currentPassword`, as proof
        that the caller is the account holder and not merely someone holding their token.
        Requires the `USER` role.
      security:
        - bearerAuth: []
      x-required-role: USER
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The stored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The token's role is not enough, or `currentPassword` is missing or wrong for a password or email change.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new username or email is already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/reinit-password:
    put:
      tags: [Users]
      operationId: resetPassword
      summary: Complete a password reset
      description: >-
        Sets a new password if the token from the reset email is valid for the given account. **Every way this can fail
        answers the same 400**: unknown email, unknown token, expired token and a token issued to another account are
        indistinguishable, so the endpoint cannot be used to discover which addresses have accounts. A token is
        single-use.
      security: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: The password was changed.
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------------------------------------------- recipes
  /recipes:
    get:
      # Hand-written signature (RecipeController.searchRecipes): it returns Page<RecipeSummaryResponse>, and the
      # generator prints a generic type's class literal into the response annotations, which does not compile.
      # OpenApiContractTest is what keeps that method honest against this entry.
      x-internal: true
      tags: [Recipes]
      operationId: searchRecipes
      summary: Search recipes
      description: >-
        A page of recipe summaries, newest first unless `sortBy` says otherwise. **Every criterion is optional, and so
        is all of them**: an unfiltered call is the home page. Supplied criteria are combined with AND. A blank value is
        treated as absent.


        A category filter reaches the category's subcategories too, at any depth, unless `includeSubcategories=false`.
        `categoryId` and `categoryName` are two spellings of one filter: supplying both unions their matches.


        `tagIds` keeps the recipes that carry **all** of the given tags, and `ingredientIds` the recipes that use
        **all** of the given ingredients, in any of their groups.


        `listId` keeps the recipes of one of the caller's recipe lists, and is how the content of a list is read. It is
        the one criterion that needs a login: the operation stays public, but a request with `listId` and no token is a
        401, and a list that is not the caller's (or does not exist) is a 404. With `listId` and no `sortBy`, the recipes
        come most recently added first (`ADDED_AT`).
      security: []
      parameters:
        - name: title
          in: query
          description: Matched against the recipe title, case-insensitively, anywhere in the string.
          schema:
            type: string
            maxLength: 200
        - name: authorId
          in: query
          description: Exactly this author.
          schema:
            type: string
        - name: authorName
          in: query
          description: Matched against the author's username, case-insensitively, anywhere in the string.
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          description: Recipes filed under this category.
          schema:
            type: string
        - name: categoryName
          in: query
          description: Matched against the category's normalized name, so typing `entrees` finds `Entrées`.
          schema:
            type: string
            maxLength: 100
        - name: includeSubcategories
          in: query
          description: Whether a category filter reaches everything filed beneath the category. Absent means true.
          schema:
            type: boolean
        - name: tagIds
          in: query
          description: >-
            Recipes that carry **every** one of these tags. Repeat the parameter to give several
            (`tagIds=a&tagIds=b`). Blank values and duplicates are dropped, an id that matches no tag matches no
            recipe, and at most 20 are accepted.
          schema:
            type: array
            maxItems: 20
            uniqueItems: true
            items:
              type: string
        - name: tagName
          in: query
          description: Matched against the tag's normalized name.
          schema:
            type: string
            maxLength: 100
        - name: ingredientIds
          in: query
          description: >-
            Recipes that use **every** one of these ingredients. Repeat the parameter to give several
            (`ingredientIds=a&ingredientIds=b`). Blank values and duplicates are dropped, an id that matches no
            ingredient matches no recipe, and at most 20 are accepted.
          schema:
            type: array
            maxItems: 20
            uniqueItems: true
            items:
              type: string
        - name: listId
          in: query
          description: >-
            Recipes that are in this recipe list. Requires a token (401 without one); a list that is not the caller's, or
            that does not exist, is a 404. Combined with AND with every other criterion.
          schema:
            type: string
        - name: sortBy
          in: query
          description: >-
            The column to order by, from a closed set. Defaults to `CREATED_AT`, or to `ADDED_AT` when `listId` is given.
            `ADDED_AT` (when the recipe was added to the list) is only valid with `listId`; without it, it is a 400. Any
            other value is a 400.
          schema:
            type: string
            enum: [CREATED_AT, UPDATED_AT, TITLE, ADDED_AT]
        - name: direction
          in: query
          description: Defaults to `DESC`.
          schema:
            type: string
            enum: [ASC, DESC]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of recipe summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRecipeSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            `listId` was given without a valid token. Only that criterion needs one: every other search is public.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`listId` names a recipe list that does not exist or belongs to someone else.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Recipes]
      operationId: createRecipe
      summary: Create a recipe
      description: >-
        Every category, tag, ingredient, unit and media id in the body must already exist; one that does not is a 400
        naming the field and the id, not a 404, because `/recipes` itself is perfectly reachable. Requires the `USER`
        role.
      security:
        - bearerAuth: []
      x-required-role: USER
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeRequest'
      responses:
        '201':
          description: The stored recipe.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recipes/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one recipe
      security: []
      responses:
        '200':
          description: The recipe, in full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Recipes]
      operationId: updateRecipe
      summary: Update a recipe
      description: >-
        A **partial** update: an absent field is left alone, and a present collection replaces the whole collection.
        `categoryIds`, `ingredientGroups` and `steps` may not be supplied empty (400); `tagIds` and `coverPictures` may.
        To remove the introduction, send `{"introduction": {"text": ""}}`.


        Only the author or an admin may edit: that depends on a database row, so it is decided by the service rather
        than by a URL rule, and any authenticated caller gets as far as that check.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeRequest'
      responses:
        '200':
          description: The stored recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The recipe is somebody else's and the caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recipes]
      operationId: deleteRecipe
      summary: Delete a recipe
      description: >-
        Cascades to the introduction, steps, ingredient groups and picture links; merely dereferences ingredients, tags,
        categories and media. Only the author or an admin may delete.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The recipe is somebody else's and the caller is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------------------------------------ recipe lists
  /lists:
    get:
      tags: [Recipe lists]
      operationId: listRecipeLists
      summary: The caller's recipe lists
      description: >-
        Every list of the caller, sorted by name (normalised, so accents and case do not matter, then as typed). **Not
        paged**: a member has at most 50. Each item carries its `recipeCount` and up to 4 `coverMediaIds`, the first
        cover picture of the most recently added recipes of the list that have one, newest first, for the photo mosaic of
        a tile.


        With `containing`, each item also carries `containsRecipe`, which says whether that recipe is in the list. The
        property is **only present when `containing` is given**, and absent otherwise. It is what the « Ajouter à une
        liste » sheet needs to show which lists already hold a recipe.
      security:
        - bearerAuth: []
      parameters:
        - name: containing
          in: query
          description: >-
            A recipe id. Adds `containsRecipe` to every item. An id that names no recipe is a 404. A blank value is
            treated as absent.
          schema:
            type: string
      responses:
        '200':
          description: The caller's lists, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`containing` names a recipe that does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Recipe lists]
      operationId: createRecipeList
      summary: Create a recipe list
      description: >-
        The new list belongs to the caller and is empty. A member has at most 50 lists, and two of a member's lists cannot
        share a name once accents, case and spacing are ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeListRequest'
      responses:
        '201':
          description: The stored list.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The request is valid and the existing state forbids it. Tell the two apart by the problem's `type`, never by
            its `detail`: `urn:recettes:problem:recipe-list-name-taken` (another list of the caller has this name) or
            `urn:recettes:problem:too-many-recipe-lists` (the caller already has 50 lists).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Recipe lists]
      operationId: getRecipeList
      summary: Get one recipe list
      description: The same shape as an item of `GET /lists`, without `containsRecipe`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Recipe lists]
      operationId: updateRecipeList
      summary: Rename a recipe list or change its emoji
      description: >-
        Both fields are required: this replaces the list's name and emoji, it does not patch them. `updatedAt` changes
        only if one of them does; adding or removing a recipe never touches it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeListRequest'
      responses:
        '200':
          description: The stored list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Another list of the caller has this name: the problem's `type` is
            `urn:recettes:problem:recipe-list-name-taken`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Recipe lists]
      operationId: deleteRecipeList
      summary: Delete a recipe list
      description: Deletes the list and its entries, never the recipes in it.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /lists/{id}/recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/RecipeId'
    put:
      tags: [Recipe lists]
      operationId: addRecipeToList
      summary: Put a recipe in a list
      description: >-
        **Idempotent**: a recipe that is already in the list is a success that changes nothing, even if the list is full.
        A list holds at most 200 recipes. The list is checked before the recipe, so a request about someone else's list
        never reveals whether the recipe exists.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The recipe is in the list.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The list does not exist or belongs to someone else, or the recipe does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: >-
            The list already holds 200 recipes and this one is not among them: the problem's `type` is
            `urn:recettes:problem:recipe-list-full`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Recipe lists]
      operationId: removeRecipeFromList
      summary: Take a recipe out of a list
      description: >-
        **Idempotent**: removing a recipe that is not in the list is a success. The recipe itself is never deleted, and
        its existence is not checked, so a recipe deleted in the meantime can still be taken out of the list the client
        shows.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The recipe is not in the list.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The list does not exist or belongs to someone else.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ------------------------------------------------------------------------------------------------- categories
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List every category
      description: Flat, name-sorted, every category at every level. Not paginated, deliberately.
      security: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      description: Omit `parentCategoryId` to create a main category. Requires the `ADMIN` role.
      security:
        - bearerAuth: []
      x-required-role: ADMIN
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: The stored category.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Invalid input, or `parentCategoryId` names no category.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /categories/hierarchy:
    get:
      tags: [Categories]
      operationId: getCategoryHierarchy
      summary: The whole taxonomy as a nested forest
      description: One call for a navigation menu, instead of `GET /categories` plus a walk on the client.
      security: []
