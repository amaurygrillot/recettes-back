            $ref: '#/components/schemas/TagResponse'
        author:
          $ref: '#/components/schemas/RecipeAuthorResponse'
        createdAt:
          type: string
          format: date-time

    # --------------------------------------------------------------------------------------------- recipe lists
    RecipeListRequest:
      type: object
      required: [name, emoji]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Trimmed. Unique among the caller's lists once accents, case and spacing are ignored. Must contain at least
            one visible character: a name made only of spaces, zero-width characters, blank-looking letters (the Hangul
            fillers, the blank Braille pattern) or accents is a 400, and so is a name with a control character or a line
            break anywhere in it. The 100 characters are counted as UTF-16 units, as Java counts them, so a name of 51
            emojis is a 400.
        emoji:
          type: string
          maxLength: 32
          description: >-
            Exactly one emoji, as typed by an emoji picker: a single grapheme cluster that is a fully-qualified emoji
            sequence (`🎂`, `❤️` with its variation selector, `👩‍🍳`, `👍🏽`, `🇫🇷`, `1️⃣`), at most 32 UTF-16 characters. A letter,
            a bare digit, an arrow, a text-style `❤` without its variation selector, two emojis side by side or an emoji
            followed by text is a 400.
    RecipeListResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        recipeCount:
          type: integer
          format: int64
          description: Every recipe of the list, with or without a picture.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Changes when the list is renamed or its emoji changes, and only then.
        coverMediaIds:
          type: array
          description: >-
            Up to 4 media ids for the photo mosaic of the tile: the first cover picture of the most recently added
            recipes of the list that have one, newest first. Empty when no recipe of the list has a picture. Fetch each
            as `/media/{id}?variant=thumbnail`.
          items:
            type: string
        containsRecipe:
          type: boolean
          description: >-
            Whether the recipe named by `containing` is in this list. **Present only on `GET /lists?containing=`**;
            omitted everywhere else.

