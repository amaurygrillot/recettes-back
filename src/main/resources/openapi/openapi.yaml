  # ------------------------------------------------------------------------------------------------------ media
  /media:
    post:
      tags: [Media]
      operationId: uploadMedia
      summary: Upload one image
      description: >-
        JPEG or PNG only, judged by the file's magic bytes and never by its name or declared type. The image is
        re-encoded, so what is stored is not what was sent. Upload first and independently, then reference the returned
        id when creating or updating a recipe. Requires the `USER` role.


        Rate limited per account (`app.media.upload-limit` uploads per `app.media.upload-limit-window`, answering 429
        with `Retry-After` beyond it). Admins are not limited.
      security:
        - bearerAuth: []
      x-required-role: USER
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image. At most 8 MB.
      responses:
        '201':
          description: The stored media.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '400':
          description: No file, not a JPEG or PNG, undecodable, or too many pixels.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /media/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Media]
      operationId: downloadMedia
      summary: Download an image
      description: >-
        Public, since recipes are public. Content never changes behind an id (editing a picture means uploading a new
        one), which is what makes the year-long `immutable` cache header honest; the `ETag` answers a conditional
        request with `If-None-Match` by a 304 and no body.
      x-spring-provide-args:
        - org.springframework.web.context.request.WebRequest webRequest
      security: []
      parameters:
        - name: variant
          in: query
          required: false
          description: >-
            `full` (the default) or `thumbnail`. `thumb` is accepted as an alias of `thumbnail`, case-insensitively.
            Anything else is a 400.
          schema:
            type: string
            default: full
      responses:
        '200':
          description: The image bytes.
          headers:
            ETag:
              description: A strong validator built from the stored checksum.
              schema:
                type: string
            Cache-Control:
              description: '`public, max-age=31536000, immutable`'
              schema:
                type: string
            Content-Disposition:
              description: '`inline`, with a file name we generated, never one the uploader supplied.'
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The caller's cached copy is still current. No body.
        '400':
          description: An unknown `variant`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from `POST /auth/login`.

  headers:
    Location:
      description: The URI of the resource that was created.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds to wait before trying again. Never less than 1.
      schema:
        type: integer
        format: int32

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The identifier of the resource.
      schema:
        type: string
    RecipeId:
      name: recipeId
      in: path
      required: true
      description: The identifier of a recipe.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size. A value above 100 is capped to 100, not rejected.
      schema:
        type: integer
        minimum: 1
        default: 20

  # Every error body is a ProblemDetail, served as application/problem+json.
  responses:
    BadRequest:
      description: Malformed or invalid input (a validation failure), including an id inside the body that names nothing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: No token, or a token that is expired, broken or from before the last restart.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated, but the token's role is not enough for this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The resource named in the path does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The request conflicts with existing state, such as a duplicate name or a row that is still in use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayloadTooLarge:
      description: The upload is over the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: This caller has used up its upload allowance. The request itself is fine; try again after the delay.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: The server is momentarily at capacity. Nothing is wrong with the request; try again after the delay.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    # --------------------------------------------------------------------------------------------------- errors
    ProblemDetail:
      description: >-
        RFC 9457. Mapped onto Spring's own ProblemDetail, whose JSON is flattened by a mixin; `type` is omitted when it
        is `about:blank`. OpenApiContractTest does not compare this schema for that reason.
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri

    # ------------------------------------------------------------------------------------------ authentication
    AuthenticationRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ReinitPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254

    # ------------------------------------------------------------------------------------------------- users
    CreateUserRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 50
        email:
          type: string
          minLength: 3
          maxLength: 254
        firstname:
          type: string
        lastname:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 50
        email:
          type: string
          description: Must be a valid email address.
          maxLength: 254
        firstname:
          type: string
        lastname:
          type: string
        currentPassword:
          type: string
          description: Required when `password` or `email` is present, and ignored otherwise.
    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 50
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        firstname:
          type: string
          nullable: true
        lastname:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string

    # ----------------------------------------------------------------------------------------- reference data
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentCategoryId:
          type: string
          description: Absent for a main category.
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        categoryType:
          type: string
          enum: [MAIN, SUB]
        parentCategoryId:
          type: string
          nullable: true
    CategoryTreeResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeResponse'
    TagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    TagResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    UnitRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        abbreviation:
          type: string
          maxLength: 20
        hidden:
          type: boolean
          description: Leave the unit out of a rendered recipe line ("3 oeufs"). False when omitted.
    UnitResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        abbreviation:
          type: string
          nullable: true
        hidden:
          type: boolean
          description: When true, a recipe line must not render the unit ("3 oeufs", not "3 pièces d'oeufs").
    IngredientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        iconMediaId:
          type: string
          description: The id of an uploaded media. Omitting it clears the icon.
    IngredientResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        iconMediaId:
