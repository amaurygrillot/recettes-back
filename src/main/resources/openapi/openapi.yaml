        coverMediaIds:
          type: array
          description: >-
            Every cover picture, in order, for a card that shows them as a small slider. Empty without a cover;
            otherwise it starts with `coverMediaId`.
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        tags:
          type: array
