#Production profile (spring.profiles.active=prod). Anything that is only a development aid is switched off here.
#The API description and its viewer are for the developer: see docs/openapi.md. The committed openapi.yaml stays the
#artifact whatever these say; they only decide whether the running app serves /v3/api-docs and Swagger UI.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
