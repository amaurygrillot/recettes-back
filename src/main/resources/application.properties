spring.application.name=recettes-back
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME}
#UPDATE PASSWORD METHOD
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.session.jdbc.initialize-schema=always
spring.security.filter.order=0
#Spring's own exceptions answer in the same RFC 9457 problem+json shape as our advice - see docs/api-error-handling.md
spring.mvc.problemdetails.enabled=true
#No lazy loading outside a transaction: a lazy collection touched during response rendering is an
#invisible extra query per row, which is exactly the N+1 the recipes read path is designed to avoid.
spring.jpa.open-in-view=false
#Loads each lazy collection level with one batched IN-query instead of one query per parent, which
#flattens the N+1 across the whole recipe graph without a single @EntityGraph. Stacking several
#LEFT JOIN FETCHes instead would throw MultipleBagFetchException or return a cartesian product.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
#Uncapped, ?size=100000 is a free denial of service on a VPS.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
#Explicit safety net independent of spring-boot-devtools' presence/defaults - see docs/security-error-handling.md
server.error.include-stacktrace=never
server.error.include-message=never
#Mail (SMTP) - fill in with real credentials to enable outgoing mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply-ilenresteunpeu.recettes@gmail.com
#Media (user-uploaded images) - see docs/media-storage.md
#The size gate that matters: Tomcat rejects an oversized part before a single byte reaches
#application code. There is deliberately no second app-level copy of this number - two values that
#must agree is a bug waiting to happen.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
#When Tomcat rejects an oversized upload it answers immediately while the client is still sending.
#It then has to read and discard the rest, or it resets the connection and the client reports a
#network error instead of the 413 that was actually written. The default (2MB) is below our own
#8MB cap, so a merely-slightly-too-big file - the common case - would always look like a crash.
#Bounded rather than unlimited (-1): swallowing without limit is itself a way to make the server
#read arbitrary bytes, so a genuinely abusive upload still gets cut off.
server.tomcat.max-swallow-size=12MB
#On the VPS this must point OUTSIDE the deployment directory, or a redeploy wipes every image.
app.media.storage-path=./media
#Decompression-bomb gate, applied to the header before any pixel is decoded. Both halves are
#needed: 8000x8000 passes a per-edge check and is still 64 MP.
app.media.max-dimension=8000
app.media.max-pixels=40000000
app.media.max-stored-edge=2000
app.media.thumbnail-edge=640
app.media.jpeg-quality=0.85
#Bounds peak heap: decoding is the memory-hungry step, and Tomcat would otherwise run it on every
#request thread at once. Saturation answers 503 + Retry-After rather than an OutOfMemoryError.
app.media.max-concurrent-processing=4
app.media.processing-timeout=10s
#Reference data seeding - grants ADMIN to an EXISTING account with this username at startup.
#Leave blank to disable. It never creates an account and never sets a password from config.
app.bootstrap.admin-username=
#Password reset
app.password-reset.token-expiry-minutes=15
#update once the frontend is created
app.password-reset.frontend-reset-url=http://localhost:8080/reset-password