spring.application.name=recettes-back
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME}
#UPDATE PASSWORD METHOD
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.session.jdbc.initialize-schema=always
spring.security.filter.order=0
#Explicit safety net independent of spring-boot-devtools' presence/defaults - see docs/security-error-handling.md
server.error.include-stacktrace=never
server.error.include-message=never
#Mail (SMTP) - fill in with real credentials to enable outgoing mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply-ilenresteunpeu.recettes@gmail.com
#Password reset
app.password-reset.token-expiry-minutes=15
#update once the frontend is created
app.password-reset.frontend-reset-url=http://localhost:8080/reset-password